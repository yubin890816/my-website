schema: spec-driven

context: |
  项目：个人品牌站（Personal Website）→ 全栈 AI 学习平台（演进中）

  技术栈：
    - 前端：React 19 + Vite 7 + TypeScript
    - 后端：FastAPI + SQLite（即将添加）

  现状：现有代码是纯前端品牌站，正在向全栈 AI 学习平台扩展。

  样式方案：
    - Tailwind CSS v4（@tailwindcss/vite 插件）
    - 暗色模式：@custom-variant dark + class 策略（.dark 父类切换）
    - FOUC 修复：index.html inline script 在 React 渲染前预设 dark class
    - motion-safe: 变体实现 prefers-reduced-motion 守卫
    - 所有图片使用 lazy loading
    - 组件文件名使用 PascalCase
    - 禁止内联 style，统一使用 Tailwind 工具类

  路由：
    - 当前：无客户端路由库，仅靠原生锚点 #home/#projects/#contact 实现页内滚动
    - scroll-padding-top: 4rem 解决固定导航栏遮挡
    - Navigation 点击处理：锚点目标缺失时 preventDefault()
    - 演进方向：待评估是否引入 React Router / TanStack Router 支持 SPA 路由

  部署：前后端统一 GitHub Pages

  约束：
    - 复用已有组件，不推倒重来
    - 新增后端不影响前端构建
    - base path: /my-website/

rules:
  proposal:
    - 必须显式列出不做的事项（out-of-scope/NOT doing 清单）
    - 高风险变更必须包含回滚方案
  specs:
    - 所有 API 行为使用 Given/When/Then 格式
    - 每个 spec 必须包含至少一个错误场景
    - 每个 requirement 的 scenario 不超过 5 个
    - 单个 spec 文件不超过 2000 词
    - 省略理由说明，除非直接影响实现
    - 使用 RFC 2119 关键词（SHALL/SHOULD/MAY）
  tasks:
    - 单个 task 不超过 2 小时工作量
    - 相关 task 按 phase 分组
    - 每个 phase 结束后包含验证步骤
    - 新建服务前必须先检查是否有可复用的已有服务
  design:
    - 包含组件层级图
    - 文档化所有 API 端点规范

Languages: |
  Generate all artifacts in Simplified Chinese.
  Use English for code-related terms.
